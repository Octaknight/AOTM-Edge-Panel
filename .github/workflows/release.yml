name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Setup Rust explicitly for standard Cargo build
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev libdbus-1-dev

      - name: Build release binaries
        run: |
          # Build only daemon and cli for broad compatibility
          cargo build --release --bin ht32paneld --bin ht32panelctl

      - name: Prepare release archive
        run: |
          PKG_NAME="ht32-panel-${{ github.ref_name }}-x86_64-linux"
          PKG_ROOT="dist/$PKG_NAME"
          mkdir -p "$PKG_ROOT/config"
          
          # Binaries
          cp target/release/ht32paneld "$PKG_ROOT/"
          cp target/release/ht32panelctl "$PKG_ROOT/"
          
          # Config
          cp -r config/* "$PKG_ROOT/config/"
          
          # Installation files
          cp packaging/install.sh "$PKG_ROOT/install.sh"
          chmod +x "$PKG_ROOT/install.sh"
          if [ -f 99-ht32-panel.rules ]; then
             cp 99-ht32-panel.rules "$PKG_ROOT/"
          fi
          cp packaging/ht32-panel.service "$PKG_ROOT/"
          if [ -f octaknight-wallpaper.png ]; then
            cp octaknight-wallpaper.png "$PKG_ROOT/"
          elif [ -f octaknight-wallpaper.jpg ]; then
            cp octaknight-wallpaper.jpg "$PKG_ROOT/"
          fi
          
          # Create archive
          TAR_NAME="$PKG_NAME.tar.gz"
          tar -czvf "$TAR_NAME" -C dist "$PKG_NAME"
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ht32-panel-*-x86_64-linux.tar.gz
          body_path: .github/RELEASE_TEMPLATE.md
          generate_release_notes: true
